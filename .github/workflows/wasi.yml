name: wasi

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: build wasi
        run: GOOS=wasip1 GOARCH=wasm go build -o pangaea.wasm
      - name: upload wasi
        uses: actions/upload-artifact@v4
        with:
          name: wasi
          path: pangaea.wasm
