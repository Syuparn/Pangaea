name: deploy-playground

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.27"
      id: go

    - name: Build WebAssembly
      run: GOOS=js GOARCH=wasm go build -o main.wasm
      working-directory: ./web/wasm

    - name: Copy dependencies to playground directory
      run: |
        cp ./web/wasm/main.wasm ./web/playground
        # NOTE: wasm_exec.js must match the Go version used to build main.wasm
        cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./web/playground

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./web/playground
