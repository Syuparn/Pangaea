version: 2
project_name: pangaea
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
    - go generate
builds:
  - main: .
    binary: pangaea
    ldflags:
      - -s -w
      - -X github.com/Syuparn/pangaea/runscript.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - freebsd
      - windows
      - linux
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    ignore:
      # NOTE: windows/arm is no longer supported since Go 1.26
      - goos: windows
        goarch: arm
archives:
  - name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    files:
      - LICENSE
      - README.md
      - CREDITS
release:
  prerelease: auto
  extra_files:
    - glob: ./LICENSE
    # lisences of the dependent modules
    - glob: ./CREDITS
